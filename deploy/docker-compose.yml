# One Sportura stack on the VPS: /opt/sportura (staging) or
# /opt/sportura-production (production). The directory name is the compose
# project name, so each stack keeps its own database and uploads volumes.
# GitHub Actions uploads this file and writes .env from the environment's
# *_ENV_FILE secret, then appends IMAGE, DEPLOY_ENV, SITE_DOMAIN and
# DB_TUNNEL_PORT. HTTPS is served by the shared proxy in deploy/proxy.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportura
      POSTGRES_USER: sportura
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
    ports:
      # SSH tunnel access only; never public. Each stack uses its own port.
      - "127.0.0.1:${DB_TUNNEL_PORT:?set DB_TUNNEL_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportura -d sportura"]
      interval: 5s
      retries: 20

  # One-shot: docker compose run --rm migrate
  migrate:
    image: ${IMAGE:?set IMAGE}
    profiles: ["tools"]
    command: ["node", "scripts/db-migrate.mjs"]
    environment:
      DATABASE_URL: postgres://sportura:${DB_OWNER_PASSWORD}@db:5432/sportura
      APP_DB_USER: sportura_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${IMAGE:?set IMAGE}
    restart: unless-stopped
    # Only what the app needs; the owner password stays out of this container.
    environment:
      DATABASE_URL: postgres://sportura_app:${APP_DB_PASSWORD}@db:5432/sportura
      APP_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      FILE_URL_SECRET: ${FILE_URL_SECRET:?set FILE_URL_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      CRON_SECRET_PREVIOUS: ${CRON_SECRET_PREVIOUS:-}
      # Email actions require SMTP_URL; without it they are unavailable.
      # Mail errors log diagnostic codes only, never confirmation links.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Optional: Google sign-in appears only when both are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - uploads:/data/storage
    networks:
      default:
      # The proxy reaches this app as staging-app or production-app.
      edge:
        aliases:
          - ${DEPLOY_ENV:?set DEPLOY_ENV}-app
    depends_on:
      db:
        condition: service_healthy

networks:
  edge:
    external: true

volumes:
  db-data:
  uploads:
