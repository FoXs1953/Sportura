name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy per environment at a time. A separate group per environment keeps
# a queued staging run from cancelling a queued production run.
concurrency:
  group: vps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    uses: ./.github/workflows/deploy-vps.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      environment: production
      secret_prefix: PRODUCTION
      domain: sportura.kz
      directory: /opt/sportura-production
      db_tunnel_port: "5433"
