name: Deploy staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        # GHCR image names must be lowercase.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload stack files and environment
        env:
          ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile "$TARGET:/opt/sportura/"
          { printf '%s\n' "$ENV_FILE"; echo "IMAGE=$IMAGE"; } \
            | ssh "$TARGET" 'umask 077 && cat > /opt/sportura/.env'

      - name: Pull image, migrate, restart
        run: |
          # Short-lived job token, passed on stdin so it never appears in a command line.
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "$TARGET" 'set -e
            cd /opt/sportura
            docker compose pull --quiet
            docker compose up -d --wait db
            docker compose run --rm migrate
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f'

      - name: Smoke check
        if: vars.STAGING_URL != ''
        run: curl -fsS -o /dev/null --retry 10 --retry-delay 5 --retry-all-errors "${{ vars.STAGING_URL }}"
